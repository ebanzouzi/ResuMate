    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->

    <!-- ── CRITICAL CSS INLINE ───────────────────────────────────────── -->
    <!--
      On injecte uniquement les styles nécessaires au rendu au-dessus de la ligne
      (Above The Fold) pour éviter le blocage du rendu initial sur 2G/3G.
      Le reste de Tailwind est chargé de façon asynchrone via le bundle.
    -->
    <style>
      /* Reset minimal + anti-FOUC (Flash Of Unstyled Content) */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #root {
        isolation: isolate;
      }

      /* Skeleton de chargement initial (avant que React ne monte) */
      #root:empty::after {
        content: "";
        display: block;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid #e2e8f0;
        border-top-color: #6366f1;
        animation: spin 0.8s linear infinite;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      @keyframes spin {
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }
    </style>

    <!-- ── DONNÉES STRUCTURÉES JSON-LD (SEO riche) ───────────────────── -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        "name": "ResuMate",
        "description": "Créateur de CV ATS-Friendly pour les talents africains. Templates modernes, aperçu temps réel, export PDF.",
        "url": "https://www.resumate.africa/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "XAF"
        },
        "inLanguage": "fr",
        "audience": {
          "@type": "Audience",
          "geographicArea": {
            "@type": "AdministrativeArea",
            "name": "Afrique"
          }
        }
      }
    </script>
  </head>

  <body>
    <!-- Point de montage React -->
    <div id="root"></div>

    <!-- ── MODULE JS (Vite injecte le bundle ici) ───────────────────── -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
